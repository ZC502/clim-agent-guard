[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clim-agent-guard"
version = "0.1.2"
description = "Deterministic execution-integrity guard for stateful agents"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
langgraph = ["langgraph>=0.3"]
e2e = ["langgraph>=0.3", "openai>=1.0"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["clim_agent_guard*"]
